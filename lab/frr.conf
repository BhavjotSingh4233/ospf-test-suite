! Baked-in FRR configuration shared by all 3 lab routers.
!
! Every router gets the exact same OSPF config: "network 172.20.0.0/24
! area 0" enables OSPF on whichever interface ends up with an address in
! that subnet, so this one file works unmodified for router1, router2 and
! router3 - each container's own DHCP-assigned address on router-net is
! what differentiates them at runtime.
!
! Router ID is left unset on purpose: FRR auto-derives it from the
! container's own interface addresses at boot, which is exactly what the
! previous manual/live vtysh setup did.
frr defaults traditional
hostname frr-lab-router
no ipv6 forwarding
!
router ospf
 network 172.20.0.0/24 area 0
exit
!
end
